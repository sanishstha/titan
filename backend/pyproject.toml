[project]
name = "titan"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
  "httpx",
  "typer",
  "pgvector",
  "tenacity",
  "pydantic-settings>=2.15.0",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "hypothesis"]

[project.scripts]
titan = "titan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
